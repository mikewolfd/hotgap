    - heading "How these numbers were made" [level=2] [ref=f8e823]
    - generic [ref=f8e824]:
      - list [ref=f8e825]:
        - listitem [ref=f8e826]:
          - text: Every cell is one household shape swept through the
          - link "PolicyEngine" [ref=f8e827] [cursor=pointer]:
            - /url: https://policyengine.org
          - text: US microsimulation at 2026 rules, earnings varied in $1,000 steps from $0 past 400% of the 2025 poverty guideline for that household size, plus $40,000 of room to recover.
        - listitem [ref=f8e828]:
          - text: The money line is
          - strong [ref=f8e829]: health-adjusted
          - text: ": household net income minus what the household actually pays in health-insurance premiums, net of the marketplace subsidy. Deductibles and copays are not included."
        - listitem [ref=f8e830]: Each archetype is a typical renter in the state’s most populous county — HUD FY2026 two-bedroom Fair Market Rent, Census Vintage 2024 county, and the DOL National Database of Childcare Prices centre-based preschool price for that same county, carried to 2026 dollars by the BLS Employment Cost Index.
        - listitem [ref=f8e831]:
          - text: The CCDF child care subsidy is
          - strong [ref=f8e832]: "on"
          - text: "for this sweep and off for a household’s own lookup. Head Start and housing vouchers are off in both: they are rationed, and assuming a family holds one inflates its numbers."
        - listitem [ref=f8e833]:
          - text: Cliffs deferred to a future renewal — Head Start’s program-year carry-over, a child’s 12 months of continuous Medicaid or CHIP eligibility, a parent’s Transitional Medical Assistance — are counted in the
          - emphasis [ref=f8e834]: deferred
          - text: column and are lifted out of every other figure here. They are real losses; they do not land in the year of the raise.
      - heading "What the model does not include" [level=3] [ref=f8e835]
      - list [ref=f8e836]:
        - listitem [ref=f8e837]: Immigration status, assets, and household members aged 65 or over are not inputs.
        - listitem [ref=f8e838]: "Alaska and Hawaii marketplace subsidies are computed upstream against the 48-state poverty guideline rather than their own higher ones (policyengine-us #9482). HotGap does not correct this, so both states’ premium-driven figures are understated."
        - listitem [ref=f8e839]: "Four state $0-premium wraps (CT, MA, NM, CA) and the child care subsidy in 28 states are local corrections HotGap applies on top of PolicyEngine, pending policyengine-us #9481 and #9405."
        - listitem [ref=f8e840]: Massachusetts cash assistance carries a local correction and an approximation notice.
      - paragraph [ref=f8e841]:
        - text: Where a state’s worst danger zone runs off the top of the axis rather than closing, the safe exit is unknown and the leap is a lower bound. Those cells read
        - strong [ref=f8e842]: past the axis
        - text: here and must not be charted as a number.
      - paragraph [ref=f8e843]: "Sweep generated 2026-09-15. Reach ladders: U.S. Census Bureau ACS 2024 1-Year PUMS, grown to 2026 dollars by the BLS Employment Cost Index. Licence: AGPL-3.0-only. Estimates only — a caseworker decides real benefits."
