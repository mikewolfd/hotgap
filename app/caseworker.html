<!doctype html>
<html lang="en" class="hg-dense">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>HotGap — caseworker</title>
  <script type="module" src="/src/caseworker/main.ts"></script>
</head>
<body>
<!-- Every word on this page comes from src/caseworker/copy.ts (app/README.md § Languages); the skeleton holds ids. -->
<a class="hg-skip" href="#ledger" id="skip"></a>
<!-- The editor prepends the ScenarioBar, the four-facts screen and the one-value
     dialog to #app, so the sticky top row's containing block is the whole page (S1). -->
<div id="app">
<main class="hg-page page">
  <h1 class="hg-visually-hidden" id="pageTitle"></h1>
  <p class="hg-source" id="status" role="status"></p>
  <div class="hg-callout hg-callout--caution" id="alert" role="alert" hidden></div>

  <div id="content" hidden>
    <div class="verdict">
      <div>
        <p class="verdict-line" id="verdictLine" tabindex="-1"></p>
        <p class="verdict-sub" id="verdictSub"></p>
      </div>
      <div class="tiles" id="tiles"></div>
    </div>

    <!-- Coverage notice and corrections sit under the verdict, before the columns (B1, B3). -->
    <div class="provenance">
      <section>
        <h2 id="coverageHeading"></h2>
        <div id="coverage"></div>
      </section>
      <section>
        <h2 id="correctionsHeading"></h2>
        <ol class="hg-rows hg-rows--stack" id="corrections"></ol>
        <p class="hg-cite" id="correctionsRest"></p>
      </section>
    </div>

    <!-- Four grid items: the curve with its drops, the ledger, the comparison (full width once it holds more than one what-if — B2), the assumptions. -->
    <div class="cols">
      <section class="lead">
        <figure class="curve">
          <h2 id="curveTitle"></h2>
          <div class="hg-chart" id="chartWrap" tabindex="0" role="group" aria-roledescription="interactive chart" aria-describedby="curveCap">
            <svg id="curve" aria-hidden="true"></svg>
            <div class="hg-marks" id="marks"></div>
          </div>
          <p class="hg-readout hg-no-print" id="readout" aria-live="polite"></p>
          <ul class="hg-key" id="key"></ul>
          <figcaption class="hg-source" id="curveCap"></figcaption>
        </figure>

        <h2 id="drops"></h2>
        <div class="hg-scroll-x">
          <table class="hg-table drops">
            <caption class="hg-no-print" id="dropsCaption"></caption>
            <thead>
              <tr><th scope="col" id="colEarnings"></th><th scope="col" class="num" id="colDrop"></th><th scope="col" id="colLost"></th><th scope="col" id="colDriver"></th></tr>
            </thead>
            <tbody id="dropRows"></tbody>
          </table>
        </div>
        <p class="footnote" id="dropsEmpty" hidden></p>

        <div class="hg-panel breakdown">
          <h3 id="bdTitle"></h3>
          <div class="bd" id="bdBars"></div>
          <p class="footnote" id="bdFootnote"></p>
        </div>
      </section>

      <section class="ledger-section">
        <h2 id="ledger" tabindex="-1"></h2>
        <table class="hg-table ledger">
          <caption id="ledgerCaption"></caption>
          <thead>
            <tr><th scope="col" class="num" id="lColEarnings"></th><th scope="col" id="lColProgram"></th><th scope="col" id="lColWho"></th></tr>
          </thead>
          <tbody id="ledgerRows"></tbody>
        </table>
        <p class="footnote" id="ledgerNote"></p>
      </section>

      <section class="compare-section" id="compareSection">
        <h2 id="compare" tabindex="-1"></h2>
        <div class="hg-scroll-x">
          <table class="hg-table compare">
            <caption id="compareCaption"></caption>
            <thead><tr id="compareHead"></tr></thead>
            <tbody id="compareRows"></tbody>
            <tfoot id="compareFoot" hidden></tfoot>
          </table>
        </div>
        <p class="footnote hg-no-print" id="compareEmpty"></p>
        <p class="footnote" id="compareNote"></p>
      </section>

      <div class="hg-panel assumptions">
        <h3 id="assumptionsHeading"></h3>
        <ul class="assumed" id="assumed"></ul>
        <p class="hg-source" id="sourceNote"></p>
        <button class="hg-button hg-button--small" type="button" id="retrySource" hidden></button>
      </div>
    </div>

    <!-- The client sheet, in the citizen register, paper only. -->
    <section class="handout hg-print-only" id="handout"></section>
  </div>

</main>
</div>
</body>
</html>
