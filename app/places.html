<!doctype html>
<html lang="en" class="hg-dense">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>HotGap — what a raise costs, state by state</title>
  <!-- Archivo is self-hosted through tokens.css (N8): no font link, no preconnect. -->
  <script type="module" src="/src/places/main.ts"></script>
</head>
<body>
<!-- The skeleton holds ids; every word is in src/places/copy.ts and is written in by render.ts (app/README.md § Languages).
     The order is the contract's (design/PICTURE-FIRST-2026-09-18.md, design/inventory.md § The page is its picture):
     one line of masthead, one sentence, the two controls that change it, the map. Nothing else is above the fold — not a lede. -->
<a class="hg-skip" href="#answer" id="skip"></a>

<!-- The same top row as the other two pages (the editor's ScenarioBar): the wordmark home, the site nav, the language, the page's one action. -->
<header class="hg-scenario hg-scenario--sticky masthead">
  <div class="hg-scenario__top">
    <h1 class="wordmark"><a class="hg-wordmark" id="wordmark" href="/"></a></h1>
    <span id="nav"></span>
    <span id="lang"></span>
    <div class="hg-scenario__actions"><button type="button" class="hg-button csv" id="csvBtn"></button></div>
  </div>
</header>

<!-- Loading and failure share one line: a status while the run loads, an alert if it does not.
     It never hides and never sits behind a disclosure (§ The page is its picture). Everything
     below stays hidden until the data is in, so neither state shows a skeleton (S6). -->
<div class="hg-page page notices"><p class="hg-source" id="status" role="status"></p></div>

<div class="hg-page page" id="main" hidden>
  <!-- THE PICTURE. Everything the map needs is inside it, in this order: the sentence as its
       caption, the two controls that change it, the tiles, the legend strip, any caution the map
       itself earns, the readout, the selected state's provenance, the estimates line, and
       "How to read this map". Nothing about the map lives outside it (charts.md § 2). -->
  <figure class="hg-picture picture">
    <figcaption class="hg-answer" id="answer" tabindex="-1"></figcaption>

    <!-- The two scopes the map, the answer, the ranking and the table all follow, directly under
         the sentence they change and above the tiles: one compact row, never a filter panel. -->
    <div class="hg-filters hg-no-print controls">
      <div>
        <label for="arch" id="archLabel"></label>
        <select id="arch" class="hg-select"></select>
      </div>
      <div>
        <label for="metric" id="metricLabel"></label>
        <select id="metric" class="hg-select"></select>
      </div>
    </div>

    <!-- StateTiles (#13): 51 buttons on the cartogram, full-bleed on a phone.
         The group takes a NAME OF ITS OWN, from the measure, rather than the
         figcaption's: a screen reader has just heard the answer sentence on
         entering the figure, and hearing thirty words again on entering the
         tiles is the same duplication the page cut everywhere it could see it. -->
    <div class="map" id="grid" role="group" aria-describedby="figDesc"></div>
    <p class="hg-visually-hidden" id="figDesc"></p>

    <!-- The legend, inside the figure, as one compact strip: the ramp, its printed bounds, and
         the tile states off the ramp that are on the map at this moment. The other three are in "How to read
         this map", drawn with the same classes, so the key cannot drift from the tiles. -->
    <div class="legend">
      <div class="scale" id="scale" aria-hidden="true"></div>
      <div class="scale-labels" id="scaleLabels"></div>
      <ul class="hg-key" id="legend"></ul>
    </div>

    <!-- Nothing that warns hides: the one caution that applies to the map a reader is looking at
         right now, in one line, with the whole of it a press away in "How to read this map". -->
    <p class="hg-callout hg-callout--caution mapCaution" id="mapCaution" hidden></p>

    <!-- CurveReadout (#4) as the map's caption: the selected state's sentences, directly under
         the tiles, never a block a screen away (rerun S1). -->
    <!-- …with the selected state's own curve under it (design critique 2026-09-25): the same line the
         household page draws, for this household in this state, zones shaded, the road marked. -->
    <div class="aside">
      <p class="hg-readout" id="readout" aria-live="polite"></p>
      <figure class="stateCurve" id="stateCurve" hidden><div id="stateCurveSvg"></div><figcaption class="hg-source" id="stateCurveCap"></figcaption></figure>
    </div>

    <!-- CorrectionsApplied (#18), IncompleteMarker (#16), otherBenefits, EligibilityBoundary (#23)
         and the state's SourceNote (#17), scoped to the selected state and under its own readout. -->
    <details class="hg-disclosure state" id="statePanel" hidden>
      <summary id="stateTitle"></summary>
      <h3 id="corrTitle"></h3>
      <p class="sub" id="stateSub"></p>
      <ul class="hg-rows hg-rows--stack" id="corrections"></ul>
      <h3 id="unmodTitle" hidden></h3>
      <ul class="hg-rows hg-rows--stack" id="unmod" hidden></ul>
      <h3 id="otherTitle" hidden></h3>
      <ul class="hg-rows hg-rows--stack" id="other" hidden></ul>
      <!-- EligibilityBoundary (#23): one row in the ledger's shape — the three facts with their publishers; never a figure, a bin or a sort. -->
      <ul class="hg-rows hg-rows--stack boundary" id="liheap" hidden></ul>
      <p class="hg-source" id="stateSrc"></p>
    </details>

    <p class="hg-source estimates" id="figSrc"></p>

    <details class="hg-disclosure howto" id="howTo">
      <summary id="howToHeading"></summary>
      <p id="figScope"></p>
      <p id="figMeasure"></p>
      <!-- Every tile state, always all four, each drawn with the tile's own class (places review S9). -->
      <ul class="hg-key" id="keyFull"></ul>
      <p id="figKeyboard"></p>
      <p class="hg-source" id="binsLine"></p>
      <p class="hg-callout hg-callout--caution" id="hatchCaution"></p>
      <p class="hg-callout hg-callout--caution" id="pastAxisNote"></p>
      <p class="glossary" id="glossary"></p>
    </details>
  </figure>

  <!-- Every state's curve, side by side on one scale: each a button that selects its state, like a tile. -->
  <details class="hg-disclosure" id="curvesPanel" open>
    <summary><h2 id="curvesHeading"></h2></summary>
    <p id="curvesLead"></p>
    <div class="multiples" id="multiples" role="group"></div>
  </details>

  <!-- RankStrip (#14) and DataTable (#15): the two readings of every state, one press away. -->
  <details class="hg-disclosure" id="everything">
    <summary><h2 id="tableHeading"></h2></summary>

    <section aria-labelledby="rankTitle" id="rankList">
      <h3 id="rankTitle"></h3>
      <!-- Lower-bound rows lead the order, under their own heading (B1). -->
      <div class="rank-group rank-group--lead" id="lowerGroup" hidden>
        <h4 id="lowerTitle"></h4>
        <ul class="rank" id="rankLower"></ul>
        <!-- Why the ranks are shared, and what the data lets a reader say about the worst (rerun B1). -->
        <p id="lowerNote"></p>
      </div>
      <div class="rank-axis" id="rankAxis"></div>
      <ul class="rank" id="rank"></ul>
      <div class="rank-group" id="noneGroup" hidden>
        <h4 id="noneTitle"></h4>
        <ul class="rank" id="rankNone"></ul>
        <p id="noneNote"></p>
      </div>
      <div class="rank-group" id="incGroup" hidden>
        <h4 id="incTitle"></h4>
        <ul class="rank" id="rankInc"></ul>
        <p id="incNote"></p>
      </div>
      <p class="hg-source" id="rankBins"></p>
    </section>

    <h3 id="table"></h3>
    <!-- The order control scopes only this table, so it sits with it (S7, inventory #21). -->
    <div class="hg-filters hg-no-print table-order">
      <div>
        <label for="sort" id="sortLabel"></label>
        <select id="sort" class="hg-select"></select>
        <!-- Said once, where the control is: Measure and Table order are independent (rerun N3). -->
        <p class="hg-source" id="sortHint"></p>
      </div>
    </div>
    <!-- One sentence per column, where the headers are (rerun S3); each header's aria-describedby points at its line. -->
    <dl class="defs" id="defs"></dl>
    <div class="hg-scroll-x" id="scroller">
      <table class="hg-table">
        <caption id="tabCap"></caption>
        <thead>
          <tr><th scope="col" id="colState"></th>
              <!-- The road out of poverty leads, as it does in the measure menu: the keep rate, the cliffs on the road, and where it collapses. -->
              <th scope="col" class="num" id="colKeepRate"></th>
              <!-- The same keep rate to exactly twice poverty, without the road's one-step allowance: the boundary sensitivity beside the figure it qualifies. -->
              <th scope="col" class="num" id="colKeepRateToLine"></th>
              <th scope="col" class="num" id="colRoadCliffCount"></th>
              <th scope="col" class="num" id="colRoadWorst"></th>
              <!-- Position rides UNDER each earnings figure, in its own cell:
                   a figure is not a finding until a reader knows how many
                   families stand below it, and three more columns pushed the
                   page itself sideways at 1280 (measured). -->
              <th scope="col" class="num" id="colRoadWorstAt"></th>
              <th scope="col" class="num" id="colBiggestLoss"></th>
              <th scope="col" class="num" id="colBiggestLossAt"></th>
              <th scope="col" class="num" id="colDangerWidth"></th>
              <th scope="col" class="num" id="colLeap"></th>
              <th scope="col" class="num" id="colSafeExit"></th>
              <th scope="col" class="num" id="colCliffCount"></th>
              <th scope="col" class="num" id="colDeferredCliffCount"></th>
              <th scope="col" id="colFigures"></th></tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <p class="hg-source" id="tableNote"></p>
  </details>

  <details class="hg-disclosure" id="methodPanel">
    <summary><h2 id="methodHeading"></h2></summary>
    <ul id="methodList"></ul>
    <h3 id="excludesHeading"></h3>
    <ul id="excludes"></ul>
  </details>

  <details class="hg-disclosure" id="sourcesPanel">
    <summary><h2 id="sourcesHeading"></h2></summary>
    <p class="hg-source" id="methodSrc"></p>
    <p class="hg-source" id="csvColumns"></p>
    <p class="hg-source" id="cite"></p>
  </details>
</div>
</body>
</html>
