name: API contract
on:
  schedule: [{ cron: "17 6 * * *" }]
  workflow_dispatch:
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: RUN_CONTRACT=1 npx vitest run contract
