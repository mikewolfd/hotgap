# Manual contract check against an external PolicyEngine endpoint.
# `api.policyengine.org` stopped accepting unauthenticated third-party requests
# in October 2026 (Auth0 server credentials + Cloud Armor 403), so the daily
# keyless cron was retired; CI's `engine-contract` job runs the full suite
# against `engine/` on every push and pull request.
name: API contract
on:
  workflow_dispatch:
    inputs:
      url:
        description: "POST /us/calculate URL (falls back to HOTGAP_PE_URL secret)"
        required: false
        type: string
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run contract
        env:
          HOTGAP_PE_URL: ${{ inputs.url || secrets.HOTGAP_PE_URL }}
          HOTGAP_PE_TOKEN: ${{ secrets.HOTGAP_PE_TOKEN }}
