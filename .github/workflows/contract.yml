# The public API is the fallback endpoint (no HOTGAP_PE_URL); this watches it
# daily so a model update there — the TAFDC probe flipping, a variable going
# away — is noticed before a user hits it. CI's engine-contract job covers the
# engine the sweep actually runs on.
name: API contract
on:
  schedule: [{ cron: "17 6 * * *" }]
  workflow_dispatch:
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: RUN_CONTRACT=1 npx vitest run contract --no-file-parallelism
