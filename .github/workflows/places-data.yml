name: Places data refresh
on:
  schedule: [{ cron: "0 7 * * 1" }]
  workflow_dispatch:
# The default GITHUB_TOKEN is read-only on fresh repos; the commit-if-changed
# step below pushes, so this workflow needs contents: write explicitly.
permissions:
  contents: write
# Never let two sweeps race each other's push; queue rather than cancel so a
# manual dispatch during the Monday run still lands.
concurrency: { group: places-data, cancel-in-progress: false }
jobs:
  refresh:
    runs-on: ubuntu-latest
    # The sweep runs on the self-hosted engine at the release pinned in
    # engine/requirements.txt — the latest model, all 51 states' child-care
    # variables, and per-request policy overrides in seconds rather than the
    # public API's 35–40 s. 561 curves took ~35 min locally at concurrency 4
    # on four engine workers, ~12% longer on the three the runner gets; give
    # a slower runner room.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - id: engine
        uses: ./.github/actions/start-engine
      # Memory every 30 s into this step's own log: a runner that runs out of
      # memory dies without running any later step, and the job then says only
      # "The operation was canceled" — the streamed log is the one trace left.
      - run: |
          ( while true; do free -m | awk -v t="$(date -u +%T)" 'NR==2 {print "[mem " t "] used " $3 " MB, available " $7 " MB"}'; sleep 30; done ) &
          npx tsx pipeline/src/run.ts --concurrency 4
        env: { HOTGAP_PE_URL: "${{ steps.engine.outputs.url }}" }
      - if: always()
        uses: actions/upload-artifact@v6
        with: { name: engine-log, path: engine.log, retention-days: 14 }
      # Pushing with the default GITHUB_TOKEN does NOT trigger other workflows'
      # `push` events, so a semantically-degenerate sweep (e.g. every state
      # collapsing to a flat curve, or a schema drift the app can't read)
      # would otherwise land on main with no CI ever having seen it. Gate the
      # commit on the same checks a normal PR would have to pass.
      - run: npm test
      - run: npm run typecheck
      - name: Commit updated data if changed
        run: |
          git config user.name "hotgap-data-bot"
          git config user.email "hotgap-data-bot@users.noreply.github.com"
          git add core/data
          git diff --cached --quiet || (git commit -m "data: weekly PolicyEngine sweep" && git push)
