name: Engine image
# Builds engine/ into DigitalOcean's container registry on every change to it.
# Watchtower on the droplet (scripts/hosted-engine.mjs) pulls each new
# `latest` and restarts the engine; a Dependabot bump of
# engine/requirements.txt therefore reaches the box by itself once CI's
# engine-contract job has passed and the PR is merged.
on:
  push:
    branches: [main]
    paths: ["engine/**", ".github/workflows/engine-image.yml"]
  workflow_dispatch:
concurrency: { group: engine-image, cancel-in-progress: true }
jobs:
  build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: registry.digitalocean.com
          # DOCR takes the API token as both username and password.
          username: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          password: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: engine
          platforms: linux/amd64
          push: true
          tags: |
            registry.digitalocean.com/hotgap/engine:latest
            registry.digitalocean.com/hotgap/engine:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
