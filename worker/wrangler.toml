# The HotGap site: static pages from app/dist, and /api/* answered by the
# Worker (worker/src/index.ts), which evaluates a household against the
# hosted PolicyEngine so the page never carries the token, the probes or the
# calculation library.
#
# Configuration names only. The endpoint and bearer token are secrets:
#   wrangler secret put HOTGAP_PE_URL
#   wrangler secret put HOTGAP_PE_TOKEN
# For `wrangler dev`, put the same two lines in worker/.dev.vars (gitignored)
# or export them in the shell (`set -a; . ../.env; set +a`). With neither set
# the Worker evaluates against the public PolicyEngine API's older model.
name = "hotgap"
main = "src/index.ts"
compatibility_date = "2026-09-15"
# Node.js compatibility: `process` (populated from bindings on this date) and
# Web Crypto are what core needs; no Node builtin is imported statically.
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "../app/dist"
binding = "ASSETS"
# /api/* never falls through to a static file; everything else is served from
# app/dist without invoking the Worker at all.
run_worker_first = ["/api/*"]

# Cloudflare's rate-limiting binding: per client IP, per Cloudflare location,
# eventually consistent — a brake on a loop hammering the droplet, not an
# accounting system. Each live evaluation is two or more PolicyEngine
# requests on a two-worker engine, so the budget is small on purpose: a
# person changing a chip every three seconds for a minute stays inside it,
# a loop does not.
[[ratelimits]]
name = "RATE_LIMIT"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

[observability]
enabled = true
